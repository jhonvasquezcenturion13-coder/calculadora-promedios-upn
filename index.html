
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Promedios UPN</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      margin: 0;
      padding: 24px;
      color: #172033;
    }
    main {
      max-width: 460px;
      margin: 20px auto;
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 18px #0001;
    }
    h1 { color: #166534; font-size: 25px; }
    p { color: #475569; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    input {
      box-sizing: border-box;
      width: 100%;
      padding: 11px;
      margin-top: 6px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      background: #15803d;
      color: white;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }
    #resultado {
      margin-top: 20px;
      padding: 14px;
      background: #f0fdf4;
      border-radius: 8px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>Mi calculadora UPN</h1>
    <p>Ingresa tus notas para calcular tu promedio ponderado.</p>

    <label for="t1">T1 (10%)</label>
    <input id="t1" type="number" min="0" max="20" step="0.1" placeholder="Ej. 16">

    <label for="t2">T2 (10%)</label>
    <input id="t2" type="number" min="0" max="20" step="0.1" placeholder="Ej. 15">

    <label for="t3">T3 (10%)</label>
    <input id="t3" type="number" min="0" max="20" step="0.1" placeholder="Ej. 18">

    <label for="ep">Examen parcial EP (20%)</label>
    <input id="ep" type="number" min="0" max="20" step="0.1" placeholder="Ej. 14">

    <label for="ef">Examen final EF (50%)</label>
    <input id="ef" type="number" min="0" max="20" step="0.1" placeholder="Ej. 16">

    <button onclick="calcular()">Calcular promedio</button>
    <div id="resultado" aria-live="polite">Tu resultado aparecerá aquí.</div>
  </main>

  <script>
    function calcular() {
      const campos = ["t1", "t2", "t3", "ep", "ef"];
      const notas = campos.map(id => document.getElementById(id).value);

      if (notas.some(n => n.trim() === "")) {
        document.getElementById("resultado").textContent =
          "Completa todas las notas para calcular.";
        return;
      }

      const [t1, t2, t3, ep, ef] = notas.map(Number);

      if (notas.some(n => !Number.isFinite(Number(n))) ||
          [t1, t2, t3, ep, ef].some(n => n < 0 || n > 20)) {
        document.getElementById("resultado").textContent =
          "Ingresa notas válidas entre 0 y 20.";
        return;
      }

      const promedio = t1 * 0.10 + t2 * 0.10 +
                       t3 * 0.10 + ep * 0.20 + ef * 0.50;

      document.getElementById("resultado").innerHTML =
        "<strong>Promedio final: " + promedio.toFixed(2) +
        " / 20</strong><br>" +
        (promedio >= 12.5 ? "¡Buen trabajo! Revisa la nota mínima aprobatoria de tu curso." :
        "Todavía puedes mejorar. Revisa tus evaluaciones pendientes.");
    }
  </script>
</body>
</html>
